<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        :root {
            --color-bg: #1e1e1e;
            --color-border: #3e3e3e;
            --color-text: #ffffff;
            --color-label: #b3b3b3;
            --color-highlight: #0078d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            overflow-y: auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section {
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 12px;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-highlight);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--color-border);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .label {
            font-size: 12px;
            color: var(--color-label);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .slider-container {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(
                to right,
                var(--color-highlight) 0%,
                var(--color-highlight) var(--value),
                var(--color-border) var(--value),
                var(--color-border) 100%
            );
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--color-highlight);
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--color-highlight);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        .value-display {
            min-width: 40px;
            text-align: right;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-highlight);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--color-highlight);
        }

        .checkbox-label {
            flex: 1;
            cursor: pointer;
            font-size: 13px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        sp-button {
            flex: 1;
        }

        .info-message {
            padding: 8px 12px;
            background-color: rgba(0, 120, 212, 0.2);
            border-left: 3px solid var(--color-highlight);
            border-radius: 3px;
            font-size: 12px;
            color: var(--color-text);
            line-height: 1.4;
        }

        select {
            width: 100%;
            padding: 6px 8px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--color-border);
            border-radius: 3px;
            color: var(--color-text);
            font-size: 12px;
            cursor: pointer;
        }

        #statusMessage {
            margin-top: 8px;
            font-size: 12px;
            color: var(--color-label);
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Información -->
        <div class="info-message">
            📷 Abre una imagen para comenzar. Los cambios se aplican en tiempo real.
        </div>

        <!-- Sección de Halftone -->
        <div class="section">
            <div class="section-title">PARÁMETROS HALFTONE</div>

            <!-- Radius -->
            <div class="control-group">
                <label class="label">Radio (Radius)</label>
                <div class="slider-container">
                    <input type="range" id="radiusSlider" min="1" max="20" value="4" />
                    <span class="value-display" id="radiusValue">4</span>
                </div>
            </div>

            <!-- Type de Halftone -->
            <div class="control-group">
                <label class="label">Tipo de Patrón</label>
                <select id="halftoneType">
                    <option value="circle">Círculos</option>
                    <option value="line">Líneas</option>
                    <option value="diamond">Diamantes</option>
                    <option value="square">Cuadrados</option>
                </select>
            </div>

            <!-- Angle -->
            <div class="control-group">
                <label class="label">Ángulo (Degrees)</label>
                <div class="slider-container">
                    <input type="range" id="angleSlider" min="0" max="360" value="45" />
                    <span class="value-display" id="angleValue">45°</span>
                </div>
            </div>
        </div>

        <!-- Sección Grayscale -->
        <div class="section">
            <div class="section-title">PROCESAMIENTO</div>

            <div class="checkbox-group">
                <input type="checkbox" id="grayscaleToggle" />
                <label class="checkbox-label" for="grayscaleToggle">
                    Convertir a Escala de Grises
                </label>
            </div>
        </div>

        <!-- Sección Levels -->
        <div class="section">
            <div class="section-title">AJUSTE DE LEVELS</div>

            <!-- Input Levels Black -->
            <div class="control-group">
                <label class="label">Punto Negro (Input)</label>
                <div class="slider-container">
                    <input type="range" id="inputBlackSlider" min="0" max="255" value="0" />
                    <span class="value-display" id="inputBlackValue">0</span>
                </div>
            </div>

            <!-- Input Levels White -->
            <div class="control-group">
                <label class="label">Punto Blanco (Input)</label>
                <div class="slider-container">
                    <input type="range" id="inputWhiteSlider" min="0" max="255" value="255" />
                    <span class="value-display" id="inputWhiteValue">255</span>
                </div>
            </div>

            <!-- Gamma/Midtones -->
            <div class="control-group">
                <label class="label">Gamma (Midtones)</label>
                <div class="slider-container">
                    <input type="range" id="gammaSlider" min="0.1" max="3" step="0.1" value="1" />
                    <span class="value-display" id="gammaValue">1.0</span>
                </div>
            </div>

            <!-- Output Levels Black -->
            <div class="control-group">
                <label class="label">Punto Negro (Output)</label>
                <div class="slider-container">
                    <input type="range" id="outputBlackSlider" min="0" max="255" value="0" />
                    <span class="value-display" id="outputBlackValue">0</span>
                </div>
            </div>

            <!-- Output Levels White -->
            <div class="control-group">
                <label class="label">Punto Blanco (Output)</label>
                <div class="slider-container">
                    <input type="range" id="outputWhiteSlider" min="0" max="255" value="255" />
                    <span class="value-display" id="outputWhiteValue">255</span>
                </div>
            </div>
        </div>

        <!-- Sección de Botones -->
        <div class="section">
            <div class="button-group">
                <sp-button id="applyButton" variant="cta">Aplicar Filtro</sp-button>
                <sp-button id="resetButton" variant="secondary">Reiniciar</sp-button>
            </div>
            <div id="statusMessage"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
